<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar · InfySkill Trainers Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .full-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--ink-100);border:1px solid var(--ink-100);border-radius:14px;overflow:hidden;}
  .full-cal-grid .fc-dow{background:var(--ink-050);padding:10px;font-size:11px;font-weight:700;color:var(--ink-500);text-align:center;}
  .full-cal-grid .fc-day{background:#fff;min-height:104px;padding:8px;position:relative;transition:background .15s var(--ease);cursor:pointer;}
  .full-cal-grid .fc-day:hover{background:var(--ink-050);}
  .full-cal-grid .fc-day.muted{color:var(--ink-300);background:var(--ink-050);}
  .full-cal-grid .fc-day.today .num{background:var(--teal-500);color:#fff;}
  .full-cal-grid .fc-day.selected{box-shadow:inset 0 0 0 2px var(--navy-900);}
  .full-cal-grid .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:99px;font-size:12.5px;font-weight:700;margin-bottom:6px;}
  .fc-chip{display:block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media(max-width:900px){.full-cal-grid .fc-day{min-height:70px;}}
</style>
</head>
<body data-page="calendar">
<a class="skip-link" href="#pageContent">Skip to content</a>
<div class="app-shell" id="app-shell-root"></div>

<script src="data/trainers.js"></script>
<script src="data/colleges.js"></script>
<script src="data/assignments.js"></script>
<script src="data/invoices.js"></script>
<script src="data/payments.js"></script>
<script src="data/misc.js"></script>
<script src="js/icons.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/calendar.js"></script>
<script>
  renderShell("calendar");
  renderCalendarPage();
</script>
</body>
</html>
